<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 탐구생활 - 교사 실시간 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #0f172a;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 flex flex-col justify-between relative">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
        <div>
            <span class="bg-indigo-600 text-white text-sm font-bold px-3 py-1 rounded-full uppercase tracking-wider">전자칠판용 대시보드</span>
            <h1 class="text-3xl md:text-4xl font-extrabold text-white mt-2 tracking-tight">인공지능의 5가지 특성 - 실시간 탐구 현황</h1>
        </div>
        <div class="flex items-center space-x-6">
            <div class="bg-slate-800 border border-slate-700 px-6 py-3 rounded-2xl flex items-center space-x-4 shadow-lg">
                <i class="fa-solid fa-users text-indigo-400 text-3xl"></i>
                <div>
                    <span class="text-xs text-slate-400 block font-semibold">제출한 학생 수</span>
                    <span id="student-count" class="text-2xl font-black text-white">0명</span>
                </div>
            </div>
            <button onclick="fetchData()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3.5 rounded-2xl font-bold text-base shadow-lg flex items-center space-x-2 transition active:scale-95">
                <i class="fa-solid fa-rotate-right"></i>
                <span>새로고침</span>
            </button>
        </div>
    </header>

    <!-- Question Analysis Grid (2 rows layout) -->
    <main class="grid grid-cols-1 md:grid-cols-6 gap-6 flex-grow my-auto" id="dashboard-grid">
        <!-- Cards injected dynamically -->
    </main>

    <!-- Modal for Question Details (Student UI Replica) -->
    <div id="question-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-6 z-50 transition-all">
        <div class="bg-slate-50 text-slate-900 rounded-3xl p-8 max-w-4xl w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <!-- Close Button -->
            <button onclick="closeModal()" class="absolute top-6 right-6 bg-slate-200 hover:bg-slate-300 text-slate-700 w-12 h-12 rounded-2xl flex items-center justify-center text-xl font-bold transition">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Question Tag & Title -->
            <div class="mb-6">
                <span id="modal-category" class="bg-indigo-100 text-indigo-700 font-bold text-sm px-4 py-1.5 rounded-lg inline-block mb-3"></span>
                <h2 id="modal-title" class="text-2xl md:text-3xl font-extrabold text-slate-900 leading-snug"></h2>
            </div>

            <!-- STEP 1 Section -->
            <div class="mb-8">
                <p class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center">
                    <i class="fa-solid fa-check-circle text-indigo-600 mr-2 text-lg"></i> STEP 1. 둘 중 인공지능(AI) 기능은 어느 것일까요?
                </p>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="modal-step1-container">
                    <!-- Option Cards Injected Here -->
                </div>
            </div>

            <!-- STEP 2 Section -->
            <div class="pt-6 border-t border-slate-200">
                <p class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center">
                    <i class="fa-solid fa-lightbulb text-amber-500 mr-2 text-lg"></i> STEP 2. 그렇게 생각한 이유는 무엇인가요?
                </p>
                <div class="space-y-3" id="modal-step2-container">
                    <!-- Reason Cards Injected Here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxm7LRNjNmovq-l5Q2ecl7a22pyxdSZeETeUk8vKAz13rb8OR1wJJfR3QahP0q9Eqhvcg/exec";

        const quizDetailData = [
            {
                id: 1, category: "상황 탐구 1", concept: "상황 인식 및 이해",
                title: "다음 두 스마트 기기 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "카메라가 화면 속 대상을 보고 '우리 집 강아지', '엄마', '모르는 사람'을 구분해서 알려주는 앱",
                nonAiOption: "사람이나 동물이 지나가서 움직임이 생기면 자동으로 켜지는 복도 센서등",
                reasons: [
                    { text: "단순히 움직임만 느끼지 않고, 화면 속 대상이 '누구'인지 알아봐서", isCorrect: true },
                    { text: "움직이면 무조건 불이 켜지기 때문에", isCorrect: false },
                    { text: "카메라가 들어있어서", isCorrect: false },
                    { text: "사람이 아무것도 누르지 않아도 작동해서", isCorrect: false }
                ]
            },
            {
                id: 2, category: "상황 탐구 2", concept: "학습",
                title: "스팸 메일을 걸러내는 두 방법 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "수많은 스팸 메일을 스스로 읽고 공부해서, 글자를 띄어 쓰거나 신조어를 써도 스팸인 것을 알아채는 기능",
                nonAiOption: "사람이 미리 입력해 둔 '대출', '광고' 같은 단어가 제목에 있으면 스팸함으로 보내는 기능",
                reasons: [
                    { text: "사람이 정해준 규칙 없이도 글을 읽고 스스로 공부해서 스팸을 찾아내서", isCorrect: true },
                    { text: "미리 정해둔 단어를 빠르게 찾기 때문에", isCorrect: false },
                    { text: "스팸 메일을 많이 모아두어서", isCorrect: false },
                    { text: "사람 대신 일을 해주기 때문에", isCorrect: false }
                ]
            },
            {
                id: 3, category: "상황 탐구 3", concept: "최적화",
                title: "목적지까지 길을 찾아주는 내비게이션 기능 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "지금 도로가 얼마나 막히는지, 사고가 났는지, 날씨는 어떤지까지 모두 따져보고 제일 빨리 도착하는 길을 계속 찾아주는 기능",
                nonAiOption: "지도에 나온 거리와 제한 속도만 계산해서 가장 짧은 거리를 알려주는 기능",
                reasons: [
                    { text: "도로 상태, 날씨 등 여러 상황을 모두 따져보고 최고의 길을 골라줘서", isCorrect: true },
                    { text: "가장 짧은 거리가 제일 좋은 길이어서", isCorrect: false },
                    { text: "지도가 계속 새로 업데이트되어서", isCorrect: false },
                    { text: "계산을 아주 빠르게 해줘서", isCorrect: false }
                ]
            },
            {
                id: 4, category: "상황 탐구 4", concept: "자율성",
                title: "화분에 물을 주는 두 장치 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "흙의 축축한 정도와 내일 비 소식을 확인한 뒤, 사람이 시키지 않아도 오늘 물을 줄지 말지 스스로 결정하는 장치",
                nonAiOption: "매일 아침 8시가 되면 정해진 시간(3분) 동안 알아서 물을 뿌려주는 타이머 장치",
                reasons: [
                    { text: "시계처럼 정해진 대로만 하지 않고, 스스로 판단해서 결정을 내려서", isCorrect: true },
                    { text: "매일 정해진 시간에 정확히 물을 주기 때문에", isCorrect: false },
                    { text: "사람이 물뿌리개를 들지 않아도 되어서", isCorrect: false },
                    { text: "비 소식을 알고 있어서", isCorrect: false }
                ]
            },
            {
                id: 5, category: "상황 탐구 5", concept: "예측",
                title: "전력을 관리하는 시스템 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "요일, 날씨, 가족들의 생활 습관을 보고 '오늘 오후 3시에 전기를 많이 쓸 것'을 미리 예상해서 에어컨을 조절하는 기능",
                nonAiOption: "지난달 우리 집에서 전기를 얼마나 썼는지 화면에 차트로 보여주는 기능",
                reasons: [
                    { text: "옛날 기록만 보여주는 게 아니라 앞으로 일어날 일을 미리 내다보고 대비해서", isCorrect: true },
                    { text: "차트를 보기 쉽게 예쁘게 그려주어서", isCorrect: false },
                    { text: "에어컨 작동을 미리 켜주어서", isCorrect: false },
                    { text: "전기를 많이 쓰는 시기를 사람이 알 수 있어서", isCorrect: false }
                ]
            }
        ];

        let latestData = [];

        async function fetchData() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                latestData = await res.json();
                renderDashboard(latestData);
            } catch (err) {
                console.error("데이터 로드 실패:", err);
            }
        }

        function renderDashboard(data) {
            document.getElementById('student-count').innerText = `${data.length}명`;

            const container = document.getElementById('dashboard-grid');
            container.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const qKeyAns = `Q${i}_답`;
                const qKeyReason = `Q${i}_이유`;

                let correctCount = 0;
                let wrongCount = 0;
                const reasonCounts = {};

                data.forEach(row => {
                    if (row[qKeyAns] && row[qKeyAns].includes("정답")) {
                        correctCount++;
                    } else if (row[qKeyAns]) {
                        wrongCount++;
                    }
                    const reason = row[qKeyReason];
                    if (reason) {
                        reasonCounts[reason] = (reasonCounts[reason] || 0) + 1;
                    }
                });

                const total = data.length || 1;
                const accuracy = Math.round((correctCount / total) * 100);

                let topReason = "선택 데이터 없음";
                let topReasonCount = 0;
                Object.entries(reasonCounts).forEach(([r, c]) => {
                    if (c > topReasonCount) {
                        topReasonCount = c;
                        topReason = r;
                    }
                });

                const gridSpanClass = i <= 3 ? "md:col-span-2" : "md:col-span-3";

                const card = document.createElement('div');
                card.className = `${gridSpanClass} bg-slate-800/90 border-2 border-slate-700/80 rounded-3xl p-6 flex flex-col justify-between shadow-2xl hover:border-indigo-400 cursor-pointer transition duration-300 group`;
                card.onclick = () => openQuestionModal(i, correctCount, wrongCount, reasonCounts);
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-sm font-black text-indigo-300 bg-indigo-950/80 px-3 py-1 rounded-xl border border-indigo-700/50">문제 ${i}</span>
                            <span class="text-xs text-indigo-300 font-bold group-hover:underline flex items-center">
                                학생 화면으로 보기 <i class="fa-solid fa-magnifying-glass-plus ml-1.5"></i>
                            </span>
                        </div>
                        <h3 class="text-xl md:text-2xl font-black text-white mb-6">${quizDetailData[i-1].concept}</h3>

                        <!-- Progress Bar -->
                        <div class="mb-6 bg-slate-900/80 p-4 rounded-2xl border border-slate-700/50">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-bold text-slate-300">정답률 (AI 선택)</span>
                                <span class="text-2xl font-black text-emerald-400">${accuracy}%</span>
                            </div>
                            <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700">
                                <div class="bg-emerald-500 h-full rounded-full transition-all duration-500 shadow-sm" style="width: ${accuracy}%"></div>
                            </div>
                        </div>

                        <!-- Top Reason -->
                        <div class="bg-slate-950/70 p-4 rounded-2xl border border-slate-700/60 shadow-inner">
                            <span class="text-xs font-bold text-amber-400 block mb-2 flex items-center">
                                <i class="fa-solid fa-comment-dots text-sm mr-2"></i> 가장 많이 선택한 이유
                            </span>
                            <p class="text-sm md:text-base font-semibold text-slate-100 leading-relaxed">"${topReason}"</p>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function openQuestionModal(qIdx, correctCount, wrongCount, reasonCounts) {
            const q = quizDetailData[qIdx - 1];
            const total = (correctCount + wrongCount) || 1;
            const correctPercent = Math.round((correctCount / total) * 100);
            const wrongPercent = Math.round((wrongCount / total) * 100);

            document.getElementById('modal-category').innerText = `${q.category} (${q.concept})`;
            document.getElementById('modal-title').innerText = q.title;

            // STEP 1
            const step1Container = document.getElementById('modal-step1-container');
            step1Container.innerHTML = `
                <!-- Option A: Non-AI Option -->
                <div class="border-2 ${wrongCount > 0 ? 'border-amber-500 bg-amber-50/50' : 'border-slate-200 bg-white'} rounded-2xl p-5 relative shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <span class="bg-slate-100 text-slate-800 font-bold px-3 py-1 rounded-md text-xs">A (비AI 기능)</span>
                        <span class="${wrongCount > 0 ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-100 text-slate-500'} text-xs px-2.5 py-1 rounded-full">
                            ${wrongCount > 0 ? '<i class="fa-solid fa-triangle-exclamation mr-1"></i> 오답 선택: ' + wrongCount + '명 (' + wrongPercent + '%)' : '0명 선택'}
                        </span>
                    </div>
                    <p class="text-sm md:text-base font-medium text-slate-800 leading-relaxed">${q.nonAiOption}</p>
                </div>

                <!-- Option B: AI Option -->
                <div class="border-2 border-indigo-600 bg-indigo-50/70 rounded-2xl p-5 relative shadow-md">
                    <div class="flex items-center justify-between mb-3">
                        <span class="bg-indigo-600 text-white font-bold px-3 py-1 rounded-md text-xs">B (인공지능 AI)</span>
                        <div class="flex items-center space-x-2">
                            <span class="bg-emerald-500 text-white font-bold text-xs px-2.5 py-1 rounded-full">
                                <i class="fa-solid fa-circle-check mr-1"></i> 정답: ${correctCount}명 (${correctPercent}%)
                            </span>
                            <div class="w-6 h-6 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs">
                                <i class="fa-solid fa-check"></i>
                            </div>
                        </div>
                    </div>
                    <p class="text-sm md:text-base font-bold text-indigo-950 leading-relaxed">${q.aiOption}</p>
                </div>
            `;

            // STEP 2: Render Reason Options (Showing BOTH Correct Answer and Top Chosen Wrong Reason)
            let topReasonText = "";
            let maxCount = -1;
            Object.entries(reasonCounts).forEach(([text, count]) => {
                if (count > maxCount) {
                    maxCount = count;
                    topReasonText = text;
                }
            });

            const step2Container = document.getElementById('modal-step2-container');
            step2Container.innerHTML = '';

            q.reasons.forEach(rObj => {
                const reasonText = rObj.text;
                const isCorrectReason = rObj.isCorrect;
                const count = reasonCounts[reasonText] || 0;
                const isTopChosen = (reasonText === topReasonText && count > 0);

                let cardStyle = "border-slate-200 bg-white text-slate-700";
                let badgeHtml = `<span class="text-slate-400 text-xs">${count}명 선택</span>`;
                let radioStyle = "border-slate-300";
                let radioContent = "";

                if (isCorrectReason) {
                    cardStyle = "border-emerald-500 bg-emerald-50/80 text-emerald-950 font-bold shadow-sm";
                    radioStyle = "border-emerald-600 bg-emerald-500 text-white";
                    radioContent = '<i class="fa-solid fa-check"></i>';
                    badgeHtml = `
                        <div class="flex items-center space-x-2">
                            <span class="bg-emerald-600 text-white text-xs font-black px-2.5 py-0.5 rounded-full flex items-center">
                                <i class="fa-solid fa-circle-check mr-1"></i> 올바른 이유 (정답)
                            </span>
                            <span class="text-emerald-800 text-xs font-bold">${count}명 선택</span>
                        </div>
                    `;
                } else if (isTopChosen) {
                    cardStyle = "border-amber-500 bg-amber-50 text-amber-950 font-bold shadow-sm";
                    radioStyle = "border-amber-600 bg-amber-500 text-white";
                    radioContent = '<i class="fa-solid fa-xmark"></i>';
                    badgeHtml = `
                        <span class="bg-amber-500 text-slate-950 text-xs font-black px-2.5 py-0.5 rounded-full flex items-center">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i> 학생들이 가장 많이 고른 오답 이유 (${count}명)
                        </span>
                    `;
                }

                const card = document.createElement('div');
                card.className = `p-4 border-2 rounded-xl flex items-center justify-between text-xs md:text-sm font-medium transition ${cardStyle}`;

                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-5 h-5 rounded-full border ${radioStyle} flex items-center justify-center text-[10px]">
                            ${radioContent}
                        </div>
                        <span>${reasonText}</span>
                    </div>
                    ${badgeHtml}
                `;
                step2Container.appendChild(card);
            });

            document.getElementById('question-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('question-modal').classList.add('hidden');
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
