<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 탐구생활 - 학생용</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .card-selected { border-color: #4f46e5 !important; background-color: #eef2ff !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-brain text-2xl text-yellow-300"></i>
                <h1 class="text-xl font-bold tracking-tight">AI 탐구생활</h1>
            </div>
            <span id="user-badge" class="hidden bg-indigo-700 px-3 py-1 rounded-full text-xs font-medium text-indigo-100">
                <i class="fa-solid fa-user mr-1"></i><span id="badge-name"></span>
            </span>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- 1. Intro Screen -->
        <section id="screen-intro" class="bg-white rounded-2xl shadow-md p-6 md:p-8 text-center my-8">
            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-900 mb-3">진짜 AI를 찾아라!</h2>
            <p class="text-slate-600 mb-6 leading-relaxed text-sm">
                5가지 상황 문제를 풀며 어떤 것이 <strong class="text-indigo-600">진짜 인공지능(AI)</strong>인지 알아봅시다!
            </p>
            
            <div class="max-w-sm mx-auto mb-8 text-left bg-slate-50 p-4 rounded-xl border border-slate-200">
                <label for="student-name" class="block text-xs font-semibold text-slate-500 uppercase mb-2">이름을 입력하세요</label>
                <input type="text" id="student-name" placeholder="예: 김민수" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <button onclick="startQuiz()" class="w-full max-w-sm bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md transition duration-200 text-base">
                탐구 시작하기 <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </section>

        <!-- 2. Quiz Screen -->
        <section id="screen-quiz" class="hidden">
            <div class="mb-6">
                <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-2">
                    <span id="quiz-progress-text">문제 1 / 5</span>
                    <span id="quiz-progress-percent">20%</span>
                </div>
                <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                    <div id="quiz-progress-bar" class="bg-indigo-600 h-full w-1/5 transition-all duration-300"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
                <div class="inline-block bg-indigo-50 text-indigo-700 font-bold text-xs px-3 py-1 rounded-md mb-3" id="question-category">
                    상황 탐구 1
                </div>
                <h3 class="text-lg font-bold text-slate-900 mb-4" id="question-title">
                    질문이 들어가는 자리입니다.
                </h3>

                <!-- STEP 1 -->
                <div class="mb-6">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                        <i class="fa-solid fa-check-circle text-indigo-500 mr-1"></i> STEP 1. 둘 중 인공지능(AI) 기능은 어느 것일까요?
                    </p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="options-container">
                        <!-- Options injected dynamically -->
                    </div>
                </div>

                <!-- STEP 2 -->
                <div id="step-2-container" class="hidden pt-4 border-t border-slate-100">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">
                        <i class="fa-solid fa-lightbulb text-amber-500 mr-1"></i> STEP 2. 그렇게 생각한 이유는 무엇인가요?
                    </p>
                    <div class="space-y-2" id="reason-options">
                        <!-- Reasons injected dynamically -->
                    </div>
                </div>
            </div>

            <div class="flex justify-end">
                <button id="btn-next" onclick="nextQuestion()" disabled class="bg-slate-200 text-slate-400 font-bold py-3 px-8 rounded-xl cursor-not-allowed transition duration-200 text-sm">
                    다음 문제로 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </section>

        <!-- 3. Result Screen -->
        <section id="screen-result" class="hidden text-center py-8">
            <div class="bg-white rounded-2xl shadow-md p-8 max-w-md mx-auto">
                <div id="submit-spinner" class="mb-4">
                    <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-600"></i>
                    <p class="text-sm font-bold text-slate-600 mt-2">선생님께 제출 중입니다...</p>
                </div>
                <div id="submit-success" class="hidden">
                    <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">제출 완료!</h2>
                    <p class="text-sm text-slate-600 leading-relaxed mb-6">
                        답안이 성공적으로 제출되었습니다.<br>전자칠판 화면을 보며 선생님과 함께 결과를 확인해 봅시다!
                    </p>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Google Script App URL (1단계에서 생성된 URL을 여기에 입력하세요)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxm7LRNjNmovq-l5Q2ecl7a22pyxdSZeETeUk8vKAz13rb8OR1wJJfR3QahP0q9Eqhvcg/exec";

        const rawQuizData = [
            {
                id: 1, category: "상황 탐구 1", concept: "상황 인식 및 이해",
                title: "다음 두 스마트 기기 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "카메라가 화면 속 대상을 보고 '우리 집 강아지', '엄마', '모르는 사람'을 구분해서 알려주는 앱",
                nonAiOption: "사람이나 동물이 지나가서 움직임이 생기면 자동으로 켜지는 복도 센서등",
                reasons: [
                    { text: "단순히 움직임만 느끼지 않고, 화면 속 대상이 '누구'인지 알아봐서", isCorrect: true },
                    { text: "움직이면 무조건 불이 켜지기 때문에", isCorrect: false },
                    { text: "카메라가 들어있어서", isCorrect: false },
                    { text: "사람이 아무것도 누르지 않아도 작동해서", isCorrect: false }
                ]
            },
            {
                id: 2, category: "상황 탐구 2", concept: "학습",
                title: "스팸 메일을 걸러내는 두 방법 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "수많은 스팸 메일을 스스로 읽고 공부해서, 글자를 띄어 쓰거나 신조어를 써도 스팸인 것을 알아채는 기능",
                nonAiOption: "사람이 미리 입력해 둔 '대출', '광고' 같은 단어가 제목에 있으면 스팸함으로 보내는 기능",
                reasons: [
                    { text: "사람이 정해준 규칙 없이도 글을 읽고 스스로 공부해서 스팸을 찾아내서", isCorrect: true },
                    { text: "미리 정해둔 단어를 빠르게 찾기 때문에", isCorrect: false },
                    { text: "스팸 메일을 많이 모아두어서", isCorrect: false },
                    { text: "사람 대신 일을 해주기 때문에", isCorrect: false }
                ]
            },
            {
                id: 3, category: "상황 탐구 3", concept: "최적화",
                title: "목적지까지 길을 찾아주는 내비게이션 기능 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "지금 도로가 얼마나 막히는지, 사고가 났는지, 날씨는 어떤지까지 모두 따져보고 제일 빨리 도착하는 길을 계속 찾아주는 기능",
                nonAiOption: "지도에 나온 거리와 제한 속도만 계산해서 가장 짧은 거리를 알려주는 기능",
                reasons: [
                    { text: "도로 상태, 날씨 등 여러 상황을 모두 따져보고 최고의 길을 골라줘서", isCorrect: true },
                    { text: "가장 짧은 거리가 제일 좋은 길이어서", isCorrect: false },
                    { text: "지도가 계속 새로 업데이트되어서", isCorrect: false },
                    { text: "계산을 아주 빠르게 해줘서", isCorrect: false }
                ]
            },
            {
                id: 4, category: "상황 탐구 4", concept: "자율성",
                title: "화분에 물을 주는 두 장치 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "흙의 축축한 정도와 내일 비 소식을 확인한 뒤, 사람이 시키지 않아도 오늘 물을 줄지 말지 스스로 결정하는 장치",
                nonAiOption: "매일 아침 8시가 되면 정해진 시간(3분) 동안 알아서 물을 뿌려주는 타이머 장치",
                reasons: [
                    { text: "시계처럼 정해진 대로만 하지 않고, 스스로 판단해서 결정을 내려서", isCorrect: true },
                    { text: "매일 정해진 시간에 정확히 물을 주기 때문에", isCorrect: false },
                    { text: "사람이 물뿌리개를 들지 않아도 되어서", isCorrect: false },
                    { text: "비 소식을 알고 있어서", isCorrect: false }
                ]
            },
            {
                id: 5, category: "상황 탐구 5", concept: "예측",
                title: "전력을 관리하는 시스템 중 인공지능(AI) 기능은 어느 것일까요?",
                aiOption: "요일, 날씨, 가족들의 생활 습관을 보고 '오늘 오후 3시에 전기를 많이 쓸 것'을 미리 예상해서 에어컨을 조절하는 기능",
                nonAiOption: "지난달 우리 집에서 전기를 얼마나 썼는지 화면에 차트로 보여주는 기능",
                reasons: [
                    { text: "옛날 기록만 보여주는 게 아니라 앞으로 일어날 일을 미리 내다보고 대비해서", isCorrect: true },
                    { text: "차트를 보기 쉽게 예쁘게 그려주어서", isCorrect: false },
                    { text: "에어컨 작동을 미리 켜주어서", isCorrect: false },
                    { text: "전기를 많이 쓰는 시기를 사람이 알 수 있어서", isCorrect: false }
                ]
            }
        ];

        // Fisher-Yates Shuffle Algorithm
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let currentQuestionIdx = 0;
        let userName = "";
        let processedQuestions = [];
        let userResponses = [];

        function startQuiz() {
            const nameInput = document.getElementById('student-name');
            if (!nameInput.value.trim()) {
                alert('이름을 입력해 주세요!');
                nameInput.focus();
                return;
            }
            userName = nameInput.value.trim();
            document.getElementById('badge-name').innerText = userName;
            document.getElementById('user-badge').classList.remove('hidden');

            // Shuffle Options and Reasons for each question
            processedQuestions = rawQuizData.map(q => {
                const options = shuffle([
                    { text: q.aiOption, isAi: true },
                    { text: q.nonAiOption, isAi: false }
                ]);
                const reasons = shuffle(q.reasons);
                return { ...q, options, reasons };
            });

            document.getElementById('screen-intro').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');

            currentQuestionIdx = 0;
            userResponses = [];
            loadQuestion();
        }

        let tempSelectedOptIdx = null;
        let tempSelectedReasonIdx = null;

        function loadQuestion() {
            const q = processedQuestions[currentQuestionIdx];

            const progress = ((currentQuestionIdx + 1) / processedQuestions.length) * 100;
            document.getElementById('quiz-progress-bar').style.width = `${progress}%`;
            document.getElementById('quiz-progress-text').innerText = `문제 ${currentQuestionIdx + 1} / 5`;
            document.getElementById('quiz-progress-percent').innerText = `${Math.round(progress)}%`;

            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-title').innerText = q.title;

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const card = document.createElement('div');
                card.id = `opt-card-${idx}`;
                card.className = "border-2 border-slate-200 rounded-xl p-4 cursor-pointer hover:border-indigo-300 transition";
                card.onclick = () => selectOption(idx);
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-2">
                        <span class="bg-slate-100 text-slate-700 font-bold px-2 py-0.5 rounded text-xs">${idx === 0 ? 'A' : 'B'}</span>
                        <i id="opt-icon-${idx}" class="fa-regular fa-circle text-slate-300 text-lg"></i>
                    </div>
                    <p class="text-xs md:text-sm text-slate-700 leading-relaxed">${opt.text}</p>
                `;
                optionsContainer.appendChild(card);
            });

            // Render Reasons
            const reasonContainer = document.getElementById('reason-options');
            reasonContainer.innerHTML = '';
            q.reasons.forEach((r, idx) => {
                const btn = document.createElement('div');
                btn.id = `reason-card-${idx}`;
                btn.className = "p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 text-xs text-slate-700 flex items-center transition";
                btn.onclick = () => selectReason(idx);
                btn.innerHTML = `
                    <div id="reason-radio-${idx}" class="w-4 h-4 rounded-full border border-slate-300 mr-3 flex items-center justify-center text-[10px]"></div>
                    <span>${r.text}</span>
                `;
                reasonContainer.appendChild(btn);
            });

            document.getElementById('step-2-container').classList.add('hidden');
            tempSelectedOptIdx = null;
            tempSelectedReasonIdx = null;
            disableNextButton();
        }

        function selectOption(idx) {
            tempSelectedOptIdx = idx;
            [0, 1].forEach(i => {
                const card = document.getElementById(`opt-card-${i}`);
                const icon = document.getElementById(`opt-icon-${i}`);
                if (i === idx) {
                    card.classList.add('card-selected');
                    icon.className = 'fa-solid fa-circle-check text-indigo-600 text-lg';
                } else {
                    card.classList.remove('card-selected');
                    icon.className = 'fa-regular fa-circle text-slate-300 text-lg';
                }
            });

            document.getElementById('step-2-container').classList.remove('hidden');
            tempSelectedReasonIdx = null;
            disableNextButton();
        }

        function selectReason(idx) {
            tempSelectedReasonIdx = idx;
            const q = processedQuestions[currentQuestionIdx];
            q.reasons.forEach((_, i) => {
                const card = document.getElementById(`reason-card-${i}`);
                const radio = document.getElementById(`reason-radio-${i}`);
                if (i === idx) {
                    card.classList.add('border-indigo-500', 'bg-indigo-50/50');
                    radio.className = 'w-4 h-4 rounded-full bg-indigo-600 border border-indigo-600 text-white mr-3 flex items-center justify-center text-[10px]';
                    radio.innerHTML = '<i class="fa-solid fa-check"></i>';
                } else {
                    card.classList.remove('border-indigo-500', 'bg-indigo-50/50');
                    radio.className = 'w-4 h-4 rounded-full border border-slate-300 mr-3 flex items-center justify-center text-[10px]';
                    radio.innerHTML = '';
                }
            });
            enableNextButton();
        }

        function enableNextButton() {
            const btn = document.getElementById('btn-next');
            btn.disabled = false;
            btn.className = "bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl cursor-pointer shadow-md transition duration-200 text-sm";
        }

        function disableNextButton() {
            const btn = document.getElementById('btn-next');
            btn.disabled = true;
            btn.className = "bg-slate-200 text-slate-400 font-bold py-3 px-8 rounded-xl cursor-not-allowed transition duration-200 text-sm";
        }

        function nextQuestion() {
            const q = processedQuestions[currentQuestionIdx];
            const chosenOption = q.options[tempSelectedOptIdx];
            const chosenReason = q.reasons[tempSelectedReasonIdx];

            userResponses.push({
                questionId: q.id,
                isCorrectAns: chosenOption.isAi ? "정답(AI선택)" : "오답(비AI선택)",
                reasonText: chosenReason.text
            });

            if (currentQuestionIdx < processedQuestions.length - 1) {
                currentQuestionIdx++;
                loadQuestion();
            } else {
                submitData();
            }
        }

        function submitData() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            const payload = {
                userName: userName,
                q1_ans: userResponses[0].isCorrectAns, q1_reason: userResponses[0].reasonText,
                q2_ans: userResponses[1].isCorrectAns, q2_reason: userResponses[1].reasonText,
                q3_ans: userResponses[2].isCorrectAns, q3_reason: userResponses[2].reasonText,
                q4_ans: userResponses[3].isCorrectAns, q4_reason: userResponses[3].reasonText,
                q5_ans: userResponses[4].isCorrectAns, q5_reason: userResponses[4].reasonText
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                document.getElementById('submit-spinner').classList.add('hidden');
                document.getElementById('submit-success').classList.remove('hidden');
            }).catch(err => {
                console.error(err);
                document.getElementById('submit-spinner').classList.add('hidden');
                document.getElementById('submit-success').classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
